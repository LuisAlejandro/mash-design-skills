name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Publication has already happened; this checks the published tag without
# duplicating the full exact-SHA Push gate or publishing new artifacts.
jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify tag, version and release inputs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/preflight.sh "$RELEASE_TAG"
