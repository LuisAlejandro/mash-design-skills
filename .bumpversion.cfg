[bumpversion]
current_version = 0.1.1
commit = True
tag = True
tag_name = {new_version}

[bumpversion:file:VERSION]

[bumpversion:file:install.sh]
search = INSTALL_VERSION="{current_version}"
replace = INSTALL_VERSION="{new_version}"

[bumpversion:file:headless/package.json]

[bumpversion:file:headless/package-lock.json]

[bumpversion:file:headless/src/server.ts]
search = version: '{current_version}',
replace = version: '{new_version}',
